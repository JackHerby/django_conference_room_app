{% extends "index.html" %}
{% block main %}
    <form action="" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ room.name }}" />
        <label for="capacity">Capacity</label>
        <input type="number"
               id="capacity"
               name="capacity"
               value="{{ room.capacity }}" />
        <input type="checkbox"
               id="is_projector_available"
               name="is_projector_available"
               {% if room.is_projector_available %}checked{% endif %} />
        <label for="is_projector_available">Is projector available?</label>
        {% csrf_token %}
        <button type="submit">{% block btn_content %}Add{% endblock %}</button>
    </form>
{% endblock %}
